<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Calculadora de ganhos e despesas para motoristas de aplicativo."
    />
    <meta name="theme-color" content="#047857" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="km líquido" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>km líquido</title>
    <!-- Tema escolhido no botão do cabeçalho, aplicado antes da tela aparecer (sem piscar o outro). -->
    <script>
      try {
        var tema = localStorage.getItem('km-liquido:tema:v1')
        if (tema === 'claro' || tema === 'escuro')
          document.documentElement.dataset.theme =
            tema === 'escuro' ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
